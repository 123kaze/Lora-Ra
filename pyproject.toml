[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carryrank"
version = "0.1.0"
description = "Minimal reproducible CarryRank-LoRA mechanism experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.7", "numpy>=1.26", "matplotlib>=3.10"]

[project.optional-dependencies]
dev = ["pytest>=8.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
