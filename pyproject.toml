[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carryrank"
version = "0.1.0"
description = "Minimal reproducible CarryRank-LoRA mechanism experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.7,<2.8", "numpy>=2.2,<2.3", "scipy>=1.15,<1.16", "matplotlib>=3.10,<3.11"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<8.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
